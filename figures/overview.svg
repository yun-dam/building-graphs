<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#333"/>
    </marker>
    <marker id="arrRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/>
    </marker>
    <style>
      .t  { font-size: 15px; fill: #222; }
      .ts { font-size: 13px; fill: #333; }
      .tb { font-size: 15px; font-weight: bold; fill: #111; }
      .h  { font-size: 20px; font-weight: bold; fill: #111; }
      .data   { fill: #eceff1; stroke: #607d8b; stroke-width: 1.5; }
      .frozen { fill: #e3f2fd; stroke: #1e88e5; stroke-width: 1.5; }
      .train  { fill: #fff3e0; stroke: #ef6c00; stroke-width: 2; }
      .llm    { fill: #f3e5f5; stroke: #8e24aa; stroke-width: 1.5; }
      .loss   { fill: #ffebee; stroke: #c0392b; stroke-width: 1.5; }
      .out    { fill: #e8f5e9; stroke: #43a047; stroke-width: 1.5; }
      .a  { stroke: #333; stroke-width: 1.6; fill: none; marker-end: url(#arr); }
      .ad { stroke: #333; stroke-width: 1.6; fill: none; stroke-dasharray: 6 4; marker-end: url(#arr); }
      .bp { stroke: #c0392b; stroke-width: 1.8; fill: none; stroke-dasharray: 7 5; marker-end: url(#arrRed); }
    </style>
  </defs>

  <rect x="0" y="0" width="1400" height="900" fill="#ffffff"/>

  <!-- ===================== PANEL A: TRAINING ===================== -->
  <rect x="15" y="15" width="1370" height="470" rx="10" fill="none" stroke="#9e9e9e" stroke-width="1.2"/>
  <text x="30" y="45" class="h">(A) Training on Build2SPARQL (154 train buildings)</text>

  <!-- Inputs -->
  <text x="40" y="82" class="tb">INPUT</text>
  <rect x="35" y="95" width="215" height="105" rx="8" class="data"/>
  <text x="48" y="120" class="tb">Training sample</text>
  <text x="48" y="143" class="ts">• question q</text>
  <text x="48" y="163" class="ts">• gold SPARQL Q*</text>
  <text x="48" y="183" class="ts">• building ID</text>

  <rect x="35" y="230" width="215" height="85" rx="8" class="data"/>
  <text x="48" y="255" class="tb">Building KG G = (V, R, E)</text>
  <text x="48" y="277" class="ts">Brick or ASHRAE 223P</text>
  <text x="48" y="297" class="ts">(instances + class hierarchy)</text>

  <!-- Encoders -->
  <rect x="295" y="95" width="215" height="60" rx="8" class="frozen"/>
  <text x="308" y="120" class="tb">Text encoder (frozen)</text>
  <text x="308" y="142" class="ts">q → d-dim question vector q</text>

  <rect x="295" y="170" width="215" height="55" rx="8" class="frozen"/>
  <text x="308" y="194" class="tb">Seed linking</text>
  <text x="308" y="214" class="ts">mentions/classes → seeds S ⊂ V</text>

  <rect x="295" y="245" width="215" height="70" rx="8" class="frozen"/>
  <text x="308" y="269" class="tb">Relation graph G_R</text>
  <text x="308" y="290" class="ts">nodes = relation types</text>
  <text x="308" y="306" class="ts">edges = 4 meta-relations</text>

  <!-- Trainable GNN -->
  <rect x="555" y="245" width="235" height="70" rx="8" class="train"/>
  <text x="568" y="270" class="tb">Relation GNN (ULTRA)</text>
  <text x="568" y="292" class="ts">→ relation embeddings {w_r}</text>
  <text x="568" y="308" class="ts">(works for unseen relations)</text>

  <rect x="555" y="95" width="235" height="130" rx="8" class="train"/>
  <text x="568" y="120" class="tb">Entity GNN (NBFNet)</text>
  <text x="568" y="142" class="ts">conditional message passing</text>
  <text x="568" y="164" class="ts">h⁰(v) = 1[v∈S] · W₀q</text>
  <text x="568" y="186" class="ts">hᵗ(v) = AGG(hᵗ⁻¹(u) ⊙ w_r) , L layers</text>
  <text x="568" y="208" class="ts">→ question-aware states h_q(v)</text>

  <rect x="835" y="95" width="225" height="130" rx="8" class="train"/>
  <text x="848" y="120" class="tb">Scoring heads</text>
  <text x="848" y="145" class="ts">node score   s(v)</text>
  <text x="848" y="167" class="ts">edge score   s(u, r, v)</text>
  <text x="848" y="189" class="ts">path score   Σ log s(edge)</text>
  <text x="848" y="211" class="ts">(GNN OUTPUT)</text>

  <!-- Loss -->
  <rect x="1105" y="95" width="265" height="130" rx="8" class="loss"/>
  <text x="1118" y="120" class="tb">Loss</text>
  <text x="1118" y="145" class="ts">BCE(s(v), Y_V)</text>
  <text x="1118" y="167" class="ts">+ BCE(s(u,r,v), Y_E)</text>
  <text x="1118" y="189" class="ts">+ λ · contrastive(P*, sibling paths)</text>
  <text x="1118" y="211" class="ts">compare prediction vs. labels</text>

  <!-- Label generation -->
  <rect x="555" y="365" width="505" height="95" rx="8" class="data" stroke-dasharray="5 3"/>
  <text x="568" y="390" class="tb">Automatic label generation (offline, no manual annotation)</text>
  <text x="568" y="413" class="ts">execute gold SPARQL Q* on G → bind all triple-pattern variables →</text>
  <text x="568" y="435" class="ts">evidence nodes Y_V · evidence edges Y_E · gold class-level path P*</text>
  <text x="568" y="452" class="ts">(e.g. VAV –feeds→ HVAC_Zone –hasPoint→ Temp_Sensor)</text>

  <!-- Arrows panel A -->
  <path d="M250,125 L295,125" class="a"/>
  <path d="M250,150 C272,150 272,197 295,197" class="a"/>
  <path d="M250,272 C272,272 272,280 295,280" class="a"/>
  <path d="M510,125 L555,125" class="a"/>
  <path d="M510,197 L555,197" class="a"/>
  <path d="M510,280 L555,280" class="a"/>
  <path d="M672,245 L672,225" class="a"/>
  <path d="M790,160 L835,160" class="a"/>
  <path d="M1060,160 L1105,160" class="a"/>
  <!-- G also feeds entity GNN (message passing over E) -->
  <path d="M142,315 L142,340 L530,340 L530,215 L555,215" class="a"/>
  <text x="300" y="334" class="ts">edges E (message passing graph)</text>
  <!-- labels inputs -->
  <path d="M250,185 L272,185 L272,358 L540,358 L540,412 L555,412" class="ad"/>
  <text x="285" y="376" class="ts">Q* and G (for label generation)</text>
  <path d="M1060,412 L1237,412 L1237,225" class="a"/>
  <text x="1110" y="405" class="ts">labels</text>

  <!-- Backprop -->
  <path d="M1237,95 L1237,70 L672,70 L672,92" class="bp"/>
  <path d="M947,70 L947,92" class="bp"/>
  <text x="760" y="63" class="ts" fill="#c0392b" style="fill:#c0392b">backpropagation: update only the orange (trainable) modules</text>

  <!-- ===================== PANEL B: INFERENCE ===================== -->
  <rect x="15" y="505" width="1370" height="300" rx="10" fill="none" stroke="#9e9e9e" stroke-width="1.2"/>
  <text x="30" y="535" class="h">(B) Inference on unseen buildings (Build2SPARQL test · BuildingQA · Stanford case study)</text>

  <text x="40" y="568" class="tb">INPUT</text>
  <rect x="35" y="580" width="215" height="70" rx="8" class="data"/>
  <text x="48" y="605" class="tb">NL question q</text>
  <text x="48" y="627" class="ts">"Which temperature sensors</text>
  <text x="48" y="643" class="ts">are in zones served by AHU-1?"</text>

  <rect x="35" y="670" width="215" height="70" rx="8" class="data"/>
  <text x="48" y="695" class="tb">Unseen building KG G</text>
  <text x="48" y="717" class="ts">never seen in training</text>
  <text x="48" y="733" class="ts">(Brick or 223P)</text>

  <rect x="295" y="600" width="250" height="120" rx="8" class="frozen"/>
  <text x="308" y="625" class="tb">Trained BRIDGE retriever</text>
  <text x="308" y="648" class="ts">(weights fixed after training)</text>
  <text x="308" y="670" class="ts">text encoder + seed linking</text>
  <text x="308" y="690" class="ts">+ relation GNN + entity GNN</text>
  <text x="308" y="710" class="ts">+ scoring heads</text>

  <rect x="590" y="600" width="250" height="120" rx="8" class="out"/>
  <text x="603" y="625" class="tb">Retrieved context</text>
  <text x="603" y="648" class="ts">top-k nodes / edges</text>
  <text x="603" y="668" class="ts">→ beam search → top-k paths</text>
  <text x="603" y="688" class="ts">→ class-level, verbalized:</text>
  <text x="603" y="708" class="ts">AHU –feeds→ VAV –feeds→ Zone …</text>

  <rect x="885" y="600" width="225" height="120" rx="8" class="llm"/>
  <text x="898" y="625" class="tb">LLM agent (BrickQA)</text>
  <text x="898" y="648" class="ts">write SPARQL from paths</text>
  <text x="898" y="668" class="ts">validate (syntax, path,</text>
  <text x="898" y="688" class="ts">arity) → execute → revise</text>
  <text x="898" y="708" class="ts">(not trained)</text>

  <text x="1160" y="590" class="tb">OUTPUT</text>
  <rect x="1155" y="600" width="215" height="120" rx="8" class="out"/>
  <text x="1168" y="625" class="tb">SPARQL query</text>
  <text x="1168" y="648" class="tb">+ answer table</text>
  <text x="1168" y="675" class="ts">evaluated by</text>
  <text x="1168" y="695" class="ts">Row-Matching F1</text>
  <text x="1168" y="713" class="ts">(retriever: Recall@k)</text>

  <path d="M250,615 L295,640" class="a"/>
  <path d="M250,705 L295,680" class="a"/>
  <path d="M545,660 L590,660" class="a"/>
  <path d="M840,660 L885,660" class="a"/>
  <path d="M1110,660 L1155,660" class="a"/>
  <!-- execute against KG -->
  <path d="M997,720 L997,775 L142,775 L142,742" class="ad"/>
  <text x="430" y="768" class="ts">execute SPARQL against the building KG</text>

  <!-- ===================== LEGEND ===================== -->
  <rect x="35" y="830" width="22" height="16" rx="3" class="data"/>
  <text x="65" y="843" class="ts">data / input</text>
  <rect x="185" y="830" width="22" height="16" rx="3" class="frozen"/>
  <text x="215" y="843" class="ts">fixed (not trained)</text>
  <rect x="365" y="830" width="22" height="16" rx="3" class="train"/>
  <text x="395" y="843" class="ts">trainable GNN</text>
  <rect x="520" y="830" width="22" height="16" rx="3" class="loss"/>
  <text x="550" y="843" class="ts">training objective</text>
  <rect x="690" y="830" width="22" height="16" rx="3" class="llm"/>
  <text x="720" y="843" class="ts">LLM (frozen, prompted)</text>
  <rect x="890" y="830" width="22" height="16" rx="3" class="out"/>
  <text x="920" y="843" class="ts">output</text>
  <line x1="1010" y1="838" x2="1050" y2="838" stroke="#c0392b" stroke-width="1.8" stroke-dasharray="7 5"/>
  <text x="1058" y="843" class="ts">gradient flow</text>
  <text x="35" y="875" class="ts">GNN input: (q, G, S)  →  GNN output: node/edge/path scores  →  system output: SPARQL + answer table</text>
</svg>
